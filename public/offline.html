<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6500">
<title>Bağlantı yok | FUWU</title>
<style>
  :root { color-scheme: light; --orange:#ff8a00; --navy:#182033; --muted:#5b6475; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f9f8f5; color:var(--navy); }
  main { max-width:420px; text-align:center; }
  .logo { font-weight:800; letter-spacing:.18em; font-size:28px; }
  .logo span { color:var(--orange); }
  .bar { width:44px; height:4px; border-radius:4px; background:var(--orange); margin:6px auto 28px; }
  h1 { font-size:24px; margin:0 0 10px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
  a { display:inline-flex; min-height:48px; align-items:center; justify-content:center; padding:0 24px; border-radius:14px; background:var(--orange); color:#241c16; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<main>
  <div class="logo">FUW<span>U</span></div>
  <div class="bar"></div>
  <h1>İnternet bağlantın yok.</h1>
  <p>Bağlantın geldiğinde kaldığın yerden devam edebilirsin. Siparişlerin ve randevuların güvende.</p>
  <a href="/">Tekrar dene</a>
</main>
</body>
</html>
