name: Launch verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-supabase-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real isolated Supabase acceptance, serial then parallel, no retries
        run: node scripts/run-local-supabase-e2e.mjs
      - name: Upload real execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/security-testing/e2e.json
            artifacts/security-testing/prelaunch-e2e-result.json
            artifacts/security-testing/commerce-e2e-result.json
            artifacts/critical-backend-repair/local-supabase/result.json
            artifacts/critical-backend-repair/local-supabase/e2e-workers-*.json
            artifacts/critical-backend-repair/mobile/
          if-no-files-found: error
