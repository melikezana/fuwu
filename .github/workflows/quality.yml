name: Security and backend quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      IYZICO_API_KEY: ""
      IYZICO_SECRET_KEY: ""
      TEST_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: PostgreSQL 17 binaries for disposable loopback clusters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          test -x "$TEST_POSTGRES_BIN/initdb"
          "$TEST_POSTGRES_BIN/postgres" --version
      - run: npm run typecheck
      - run: npm run check:lint
      - run: npm run test:unit
      - run: npm run test:unit:coverage
      - run: npm run test:integration
      - run: npm run test:mock
      - run: npm run test:security
      - run: npm run check:build
      - name: Upload actual check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-and-test-evidence
          path: |
            artifacts/security-testing/*-result.json
            artifacts/security-testing/*.log
            artifacts/security-testing/dependency-audit.json
            artifacts/security-testing/coverage/
            artifacts/security-testing/db-clean/database-tests.json
            artifacts/security-testing/db-upgrade/database-tests.json
            artifacts/security-testing/migration-*.json
